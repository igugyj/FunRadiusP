<svg width="100%" viewBox="0 0 680 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb17a8"/>
      <stop offset="100%" stop-color="#ff7ac5"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb17a8"/>
      <stop offset="100%" stop-color="#ffa2e1"/>
    </linearGradient>
  </defs>
  <style>
    .logo-fill { fill: url(#g); }
    .text-fill { fill: url(#gt); }
    @media (prefers-color-scheme: dark) {
      .text-fill { fill: url(#gt); }
    }
  </style>

  <!-- Icon: three overlapping circles forming a playful 'R' -->
  <circle cx="52" cy="60" r="28" class="logo-fill" opacity="0.9"/>
  <circle cx="52" cy="36" r="18" class="logo-fill" opacity="0.7"/>
  <circle cx="52" cy="84" r="18" class="logo-fill" opacity="0.7"/>
  <circle cx="66" cy="60" r="12" fill="#fff" opacity="0.3"/>

  <!-- Text -->
  <text
    class="text-fill"
    x="108" y="84"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="70"
    font-weight="700"
    letter-spacing="2">FunRadiusP</text>
</svg>
