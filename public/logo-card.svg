<svg xmlns="http://www.w3.org/2000/svg" width="580" height="205" viewBox="0 0 580 205">
<defs>
  <filter id="gg" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <radialGradient id="bg" cx="50%" cy="42%" r="62%">
    <stop offset="0%"   stop-color="#1a0533"/>
    <stop offset="100%" stop-color="#040810"/>
  </radialGradient>

  <linearGradient id="bord" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#fb17a8"/>
    <stop offset="50%"  stop-color="#ff7ac5"/>
    <stop offset="100%" stop-color="#fb17a8"/>
  </linearGradient>

  <linearGradient id="bord-lo" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#fb17a8" stop-opacity=".3"/>
    <stop offset="50%"  stop-color="#ff7ac5" stop-opacity=".2"/>
    <stop offset="100%" stop-color="#fb17a8" stop-opacity=".3"/>
  </linearGradient>

  <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fb17a8"/>
    <stop offset="100%" stop-color="#ffa2e1"/>
  </linearGradient>

  <clipPath id="cc">
    <path d="
      M 62,175
      C 28,175 22,140 41,122
      C 21,104 26,77  55,75
      C 44,49  85,37  114,58
      C 123,28 168,22 192,52
      C 208,20 258,16 280,49
      C 302,16 352,20 368,52
      C 392,22 437,28 446,58
      C 475,37 516,49 505,75
      C 534,77 539,104 519,122
      C 538,140 532,175 498,175
      C 486,192 445,194 431,177
      C 407,198 356,198 330,180
      C 304,200 257,200 230,180
      C 204,198 153,198 129,177
      C 115,194 74,192 62,175 Z
    "/>
  </clipPath>
</defs>

<g clip-path="url(#cc)">
  <rect width="580" height="205" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <g opacity="0.06">
    <circle cx="290" cy="102" r="160" fill="none" stroke="#fb17a8" stroke-width="1"/>
    <circle cx="290" cy="102" r="120" fill="none" stroke="#fb17a8" stroke-width="1"/>
    <circle cx="290" cy="102" r="80"  fill="none" stroke="#fb17a8" stroke-width="1"/>
  </g>

  <!-- Subtle grid -->
  <g stroke="#fb17a8" stroke-width=".5" opacity=".04">
    <line x1="0"   y1="40"  x2="580" y2="40"/>
    <line x1="0"   y1="80"  x2="580" y2="80"/>
    <line x1="0"   y1="120" x2="580" y2="120"/>
    <line x1="0"   y1="160" x2="580" y2="160"/>
    <line x1="96"  y1="0"   x2="96"  y2="205"/>
    <line x1="193" y1="0"   x2="193" y2="205"/>
    <line x1="290" y1="0"   x2="290" y2="205"/>
    <line x1="387" y1="0"   x2="387" y2="205"/>
    <line x1="484" y1="0"   x2="484" y2="205"/>
  </g>

  <!-- Title -->
  <text fill="url(#gt)"
        x="290" y="100"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="64" font-weight="700"
        text-anchor="middle" dominant-baseline="central"
        filter="url(#gg)">FunRadiusP</text>

  <!-- Subtitle -->
  <text fill="#ff7ac5" opacity=".6"
